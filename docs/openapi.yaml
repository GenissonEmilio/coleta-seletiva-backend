            example:
              logradouro: Rua Fictícia
              numero: '10'
              bairro: Centro
              municipio: Cidade Demonstração
              uf: SE
              cep: '49000000'
              complemento: Casa
        required: true
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnderecoResponse'
