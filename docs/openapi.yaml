  /api/v1/solicitacoes:
    get:
      tags:
      - Solicitações
      summary: Lista solicitações do contexto do ator, da mais recente para a mais antiga
      description: 'Morador vê as próprias; operador, as dos seus pontos; administrador, todas. Filtros opcionais
        e combináveis. Período pela data de criação, com início inclusivo e fim exclusivo, em ISO 8601 com offset
        (ex.: 2026-11-01T00:00:00Z)'
      operationId: listar
      parameters:
      - name: X-Ator-Tipo
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMINISTRADOR
          - MORADOR
          - OPERADOR
        description: Contexto fictício. Use o papel permitido pela operação.
        example: MORADOR
      - name: X-Ator-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
        description: Obrigatório para MORADOR e OPERADOR. Consulte /api/v1/demo/atores.
        example: 1
      - name: inicio
        in: query
        required: false
        schema:
          type: string
          format: date-time
        example: '2026-11-10T23:34:31Z'
      - name: fim
        in: query
        required: false
        schema:
          type: string
          format: date-time
        example: '2026-11-12T23:34:31Z'
      - name: situacao
        in: query
        required: false
        schema:
          type: string
          enum:
          - SOLICITADA
          - AGENDADA
          - RECUSADA
          - CANCELADA
          - EM_RECOLHIMENTO
          - CONCLUIDA
        example: CONCLUIDA
      - name: pontoId
        in: query
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
        example: 1
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaResponseSolicitacaoResumoResponse'
              example:
                content:
                - id: 1
                  protocolo: CS-20261111-NQEHCS
                  situacao: CONCLUIDA
                  criadaEm: '2026-11-11T23:34:31.702Z'
                  agendadaPara: '2026-11-14T23:34:31Z'
                  concluidaEm: '2026-11-11T23:34:31.931Z'
                  moradorId: 1
                  pontoId: 1
                  nomePonto: Ecoponto Demo A
                page: 0
                size: 1
                totalElements: 1
                totalPages: 1
        '400':
          description: Revise os campos informados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: ENTRADA_INVALIDA
                mensagem: Revise os campos informados.
                errosCampos:
                - campo: size
                  mensagem: deve estar entre 1 e 100
