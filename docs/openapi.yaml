          type: integer
          format: int64
          example: 1
        pontoId:
          type: integer
          format: int64
          example: 1
        endereco:
          $ref: '#/components/schemas/EnderecoCopiado'
        observacoes:
          type:
          - string
          - 'null'
          example: Portão azul, tocar a campainha
        itens:
          type: array
          description: Ordenados pelo nome do material
          items:
            $ref: '#/components/schemas/Item'
        historico:
          type: array
