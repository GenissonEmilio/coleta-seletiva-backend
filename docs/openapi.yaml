      summary: Atualiza nome, e-mail e telefone de um morador
      operationId: atualizar_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoradorRequest'
            example:
              nome: Alex Exemplo
              email: alex@example.org
              telefone: '79900000000'
        required: true
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoradorResponse'
              example:
                id: 2
                nome: Alex Exemplo
                email: alex@example.org
                telefone: '79900000000'
                ativo: true
        '400':
          description: Revise os campos informados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: ENTRADA_INVALIDA
                mensagem: Revise os campos informados.
                errosCampos:
                - campo: nome
                  mensagem: não deve estar em branco
                - campo: email
                  mensagem: não deve estar em branco
