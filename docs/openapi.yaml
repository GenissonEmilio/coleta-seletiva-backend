      summary: Mostra quem é o ator dos cabeçalhos X-Ator-Tipo e X-Ator-Id e seus pontos
      description: Ator ausente, desconhecido ou inativo responde 403 ACESSO_NEGADO
      operationId: atual
      parameters:
      - name: X-Ator-Tipo
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMINISTRADOR
          - MORADOR
          - OPERADOR
        description: Contexto fictício. Use o papel permitido pela operação.
        example: OPERADOR
      - name: X-Ator-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
        description: Obrigatório para MORADOR e OPERADOR. Consulte /api/v1/demo/atores.
        example: 1
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextoResponse'
              example:
                tipo: OPERADOR
                id: 1
                nome: Ana Operadora (ponto A)
                pontoIds:
                - 1
        '403':
          description: Selecione um ator de demonstração válido (X-Ator-Tipo e X-Ator-Id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: ACESSO_NEGADO
                mensagem: Selecione um ator de demonstração válido (X-Ator-Tipo e X-Ator-Id).
                errosCampos: []
components:
  schemas:
    ItemSolicitacaoRequest:
      type: object
      description: Material e quantidade estimada de um item da solicitação
      properties:
        materialId:
          type: integer
          format: int64
          example: 2
        quantidadeEstimada:
          type: number
          description: Maior que zero, na unidade do material; inteira para UNIDADE
          example: 2.5
      required:
      - materialId
      - quantidadeEstimada
    SolicitacaoCorrecaoRequest:
      type: object
      description: Correção de endereço e itens, permitida só em SOLICITADA. A lista substitui todos os itens
      properties:
        versao:
          type: integer
          format: int64
          description: Versão que o cliente leu; se estiver desatualizada, 409 CONFLITO_VERSAO
          example: 0
          minimum: 0
        enderecoId:
          type: integer
          format: int64
          description: Endereço do próprio morador
          example: 1
        itens:
          type: array
          description: Nova lista completa de itens
          items:
            $ref: '#/components/schemas/ItemSolicitacaoRequest'
          minItems: 1
      required:
      - enderecoId
      - itens
      - versao
    EnderecoCopiado:
      type: object
      description: Cópia do endereço no momento da solicitação; não muda se o cadastro mudar
      properties:
        enderecoId:
          type: integer
          format: int64
          description: Cadastro de onde a cópia foi tirada
          example: 1
        logradouro:
          type: string
          example: Rua das Flores
        numero:
          type: string
          example: '200'
        semNumero:
          type: boolean
          example: false
        bairro:
          type: string
          example: Centro
        municipio:
          type: string
          example: Cidade Teste
        uf:
          type: string
          example: SE
        cep:
          type: string
          example: '49000000'
        complemento:
          type: string
          example: Apto 2
    Historico:
      type: object
      description: 'Alteração registrada: situação anterior e nova, data, responsável e motivo'
      properties:
        situacaoAnterior:
          type:
          - string
          - 'null'
          description: Nulo na criação
          enum:
          - SOLICITADA
          - AGENDADA
          - RECUSADA
          - CANCELADA
          - EM_RECOLHIMENTO
          - CONCLUIDA
          - null
        situacaoNova:
          type: string
          enum:
          - SOLICITADA
          - AGENDADA
          - RECUSADA
          - CANCELADA
          - EM_RECOLHIMENTO
          - CONCLUIDA
          example: SOLICITADA
        ocorridoEm:
          type: string
          format: date-time
          example: '2026-11-11T17:30:00Z'
        responsavelTipo:
          type: string
          enum:
          - MORADOR
          - OPERADOR
          - ADMIN
          example: MORADOR
        responsavelId:
          type: integer
          format: int64
          example: 1
        motivo:
          type:
          - string
          - 'null'
          description: Na correção, guarda o endereço e os itens anteriores
        agendamentoNovo:
          type:
          - string
          - 'null'
          format: date-time
          description: Nova data, quando a alteração agenda ou reagenda
    Item:
      type: object
      description: Item da solicitação, com a unidade copiada do material
      properties:
        materialId:
          type: integer
          format: int64
          example: 2
        nomeMaterial:
          type: string
          example: Vidro
        unidade:
          type: string
          enum:
          - KG
          - LITRO
          - UNIDADE
          example: KG
        quantidadeEstimada:
          type: number
          example: 2.5
        quantidadeEfetiva:
          type:
          - number
          - 'null'
          description: Nulo até a conclusão
    SolicitacaoResponse:
      type: object
      description: Solicitação com as cópias do endereço e das unidades, os itens e o histórico
      properties:
        id:
          type: integer
          format: int64
          example: 1
        protocolo:
          type: string
          example: CS-20261111-K7P3QX
        situacao:
          type: string
          enum:
          - SOLICITADA
          - AGENDADA
          - RECUSADA
          - CANCELADA
          - EM_RECOLHIMENTO
          - CONCLUIDA
          example: SOLICITADA
        versao:
          type: integer
          format: int64
          description: Enviar de volta nas alterações
          example: 0
        criadaEm:
          type: string
          format: date-time
          example: '2026-11-11T17:30:00Z'
        agendadaPara:
          type:
          - string
          - 'null'
          format: date-time
          description: Nulo até o agendamento
          example: '2026-11-15T12:00:00Z'
        concluidaEm:
          type:
          - string
          - 'null'
          format: date-time
          description: Nulo até a conclusão
