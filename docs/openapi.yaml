# Contrato gerado pelo SpringDoc e complementado com exemplos HTTP verificados.
openapi: 3.1.0
info:
  title: API do Sistema de Coleta Seletiva
  description: API acadêmica com exemplos capturados em ambiente local com dados fictícios. Substitua os IDs pelos
    registros do seu ambiente. Para agendar ou reagendar, use uma data futura com fuso horário. Envie a versão retornada
    pela última leitura nas mutações de uma solicitação existente. Se receber CONFLITO_VERSAO, releia o registro
    antes de tentar novamente. O contexto por cabeçalhos serve para demonstração. As páginas começam em 0 e aceitam
    size de 1 a 100.
  version: v1
servers:
- url: http://localhost:8080
  description: Ambiente local
tags:
- name: Moradores
  description: Cadastro, consulta e atualização de moradores
- name: Consulta pública
  description: Pontos e materiais ativos, sem dados de moradores ou operadores
- name: Endereços
  description: Endereços de um morador; cada endereço pertence a um único morador
- name: Indicadores
  description: Resumo gerencial no contexto de demonstração do administrador
- name: Solicitações
  description: Criação, correção, consultas e ações pelo contexto do ator (X-Ator-Tipo e X-Ator-Id). Simulação de
    demonstração, não é autenticação
- name: Operadores
  description: Cadastro de operadores e vínculos com pontos. Exige o cabeçalho X-Ator-Tipo (simulação de demonstração,
    não é autenticação)
- name: Materiais aceitos
  description: Vínculo entre pontos de coleta e materiais, com observações e limite
- name: Contexto de demonstração
  description: Seleção de ator fictício. Não é autenticação nem serve para produção
- name: Pontos de coleta
  description: Cadastro administrativo de pontos de coleta, incluindo pontos inativos
- name: Materiais
  description: Catálogo administrativo de materiais e unidades, incluindo materiais inativos
paths:
  /api/v1/solicitacoes/{id}/dados:
    put:
      tags:
      - Solicitações
      summary: Corrige endereço e itens de uma solicitação ainda em SOLICITADA
      description: 'Recebe a versão lida pelo cliente, refaz todas as validações e registra os dados anteriores
        no histórico. Versão antiga: 409 CONFLITO_VERSAO; já agendada: 409 TRANSICAO_INVALIDA'
      operationId: corrigir
      parameters:
      - name: X-Ator-Tipo
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMINISTRADOR
          - MORADOR
          - OPERADOR
        description: Contexto fictício. Use o papel permitido pela operação.
        example: MORADOR
      - name: X-Ator-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
        description: Obrigatório para MORADOR e OPERADOR. Consulte /api/v1/demo/atores.
        example: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitacaoCorrecaoRequest'
            example:
              enderecoId: 1
              itens:
              - materialId: 1
                quantidadeEstimada: 4
              versao: 0
        required: true
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoResponse'
              example:
                id: 1
                protocolo: CS-20261111-NQEHCS
                situacao: SOLICITADA
                versao: 1
                criadaEm: '2026-11-11T23:34:31.702Z'
                agendadaPara: null
                concluidaEm: null
                moradorId: 1
                pontoId: 1
                endereco:
                  enderecoId: 1
                  logradouro: Rua Fictícia
                  numero: '10'
                  semNumero: false
                  bairro: Centro
                  municipio: Cidade Demonstração
                  uf: SE
                  cep: '49000000'
                  complemento: Casa
                observacoes: null
                itens:
                - materialId: 1
                  nomeMaterial: Papel
                  unidade: KG
                  quantidadeEstimada: 4
                  quantidadeEfetiva: null
                historico:
                - situacaoAnterior: null
                  situacaoNova: SOLICITADA
                  ocorridoEm: '2026-11-11T23:34:31.702Z'
                  responsavelTipo: MORADOR
                  responsavelId: 1
                  motivo: null
                  agendamentoNovo: null
                - situacaoAnterior: SOLICITADA
                  situacaoNova: SOLICITADA
                  ocorridoEm: '2026-11-11T23:34:31.824Z'
                  responsavelTipo: MORADOR
                  responsavelId: 1
                  motivo: 'Correção de dados. Endereço anterior: Rua Fictícia, 10, Centro, Cidade Demonstração/SE,
                    CEP 49000000. Itens anteriores: Papel 3 KG.'
                  agendamentoNovo: null
        '409':
          description: A solicitação foi alterada por outra operação. Recarregue e tente novamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: CONFLITO_VERSAO
                mensagem: A solicitação foi alterada por outra operação. Recarregue e tente novamente.
                errosCampos: []
  /api/v1/pontos/{pontoId}/materiais/{materialId}:
    put:
      tags:
      - Materiais aceitos
      summary: Vincula um material ao ponto ou atualiza o vínculo; repetir nunca cria segunda linha
      description: 201 quando o vínculo é criado, 200 quando já existia e foi atualizado
      operationId: vincular
      parameters:
      - name: pontoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: materialId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PontoMaterialRequest'
            example:
              limitePorSolicitacao: 10
              observacoes: Papel seco.
        required: true
      responses:
        '201':
          description: Recurso criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PontoMaterialResponse'
              example:
                pontoId: 1
                materialId: 1
                nomeMaterial: Papel
                unidade: KG
                orientacaoPreparo: Mantenha o papel seco.
                observacoes: Papel seco.
                limitePorSolicitacao: 10
        '404':
          description: 'Material não encontrado(a): 999999'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: REGISTRO_NAO_ENCONTRADO
                mensagem: 'Material não encontrado(a): 999999'
                errosCampos: []
        '200':
          description: Vínculo existente atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PontoMaterialResponse'
              example:
                pontoId: 1
                materialId: 1
                nomeMaterial: Papel
                unidade: KG
                orientacaoPreparo: Mantenha o papel seco.
                observacoes: Papel seco.
                limitePorSolicitacao: 10
    delete:
      tags:
      - Materiais aceitos
      summary: Remove o vínculo entre o ponto e o material
      description: Retorna 409 se uma solicitação aberta do ponto contiver o material
      operationId: remover
      parameters:
      - name: pontoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      - name: materialId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        '204':
          description: Operação concluída, sem corpo de resposta.
        '404':
          description: 'Material aceito não encontrado(a): 999999'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: REGISTRO_NAO_ENCONTRADO
                mensagem: 'Material aceito não encontrado(a): 999999'
                errosCampos: []
  /api/v1/pontos/{id}:
    get:
      tags:
      - Pontos de coleta
      summary: Detalha um ponto de coleta, inclusive se estiver inativo
      operationId: buscar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PontoResponse'
              example:
                id: 3
                nome: Ecoponto Exemplo
                logradouro: Rua Fictícia
                numero: '10'
                semNumero: false
                bairro: Centro
                municipio: Cidade Demonstração
                uf: SE
                cep: '49000000'
                complemento: null
                contato: null
                horarios: null
                recolhimentoDomiciliar: true
                ativo: true
        '404':
          description: 'Ponto não encontrado(a): 999999'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: REGISTRO_NAO_ENCONTRADO
                mensagem: 'Ponto não encontrado(a): 999999'
                errosCampos: []
    put:
      tags:
      - Pontos de coleta
      summary: Atualiza os dados de um ponto de coleta sem alterar sua situação
      operationId: atualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PontoRequest'
            example:
              logradouro: Rua Fictícia
              numero: '10'
              bairro: Centro
              municipio: Cidade Demonstração
              uf: SE
              cep: '49000000'
              nome: Ecoponto Exemplo
              recolhimentoDomiciliar: true
              horarios: Seg a sex, 8h às 17h
        required: true
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PontoResponse'
              example:
                id: 3
                nome: Ecoponto Exemplo
                logradouro: Rua Fictícia
                numero: '10'
                semNumero: false
                bairro: Centro
                municipio: Cidade Demonstração
                uf: SE
                cep: '49000000'
                complemento: null
                contato: null
                horarios: Seg a sex, 8h às 17h
                recolhimentoDomiciliar: true
                ativo: true
        '404':
          description: 'Ponto não encontrado(a): 999999'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: REGISTRO_NAO_ENCONTRADO
                mensagem: 'Ponto não encontrado(a): 999999'
                errosCampos: []
  /api/v1/operadores/{id}:
    get:
      tags:
      - Operadores
      summary: Consulta um operador e seus vínculos (administrador ou o próprio operador)
      operationId: buscar_1
      parameters:
      - name: X-Ator-Tipo
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMINISTRADOR
          - MORADOR
          - OPERADOR
        description: Contexto fictício. Use o papel permitido pela operação.
        example: ADMINISTRADOR
      - name: X-Ator-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
        description: Obrigatório para MORADOR e OPERADOR. Consulte /api/v1/demo/atores.
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorResponse'
              example:
                id: 3
                nome: Operador Exemplo
                email: operador@example.org
                ativo: true
                pontos: []
        '404':
          description: 'Operador não encontrado(a): 999999'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: REGISTRO_NAO_ENCONTRADO
                mensagem: 'Operador não encontrado(a): 999999'
                errosCampos: []
    put:
      tags:
      - Operadores
      summary: Atualiza nome e e-mail de um operador (administrador)
      operationId: atualizar_1
      parameters:
      - name: X-Ator-Tipo
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMINISTRADOR
          - MORADOR
          - OPERADOR
        description: Contexto fictício. Use o papel permitido pela operação.
        example: ADMINISTRADOR
      - name: X-Ator-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
        description: Obrigatório para MORADOR e OPERADOR. Consulte /api/v1/demo/atores.
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperadorRequest'
            example:
              nome: Operador de Apoio
              email: operador@example.org
        required: true
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorResponse'
              example:
                id: 3
                nome: Operador de Apoio
                email: operador@example.org
                ativo: true
                pontos: []
        '403':
          description: Selecione um ator de demonstração válido (X-Ator-Tipo e X-Ator-Id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: ACESSO_NEGADO
                mensagem: Selecione um ator de demonstração válido (X-Ator-Tipo e X-Ator-Id).
                errosCampos: []
  /api/v1/operadores/{id}/pontos/{pontoId}:
    put:
      tags:
      - Operadores
      summary: Vincula o operador ao ponto (administrador); repetir nunca cria segunda linha
      description: 201 quando o vínculo é criado, 200 quando já existia
      operationId: vincular_1
      parameters:
      - name: X-Ator-Tipo
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMINISTRADOR
          - MORADOR
          - OPERADOR
        description: Contexto fictício. Use o papel permitido pela operação.
        example: ADMINISTRADOR
      - name: X-Ator-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
        description: Obrigatório para MORADOR e OPERADOR. Consulte /api/v1/demo/atores.
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      - name: pontoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      responses:
        '201':
          description: Recurso criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorResponse'
              example:
                id: 3
                nome: Operador de Apoio
                email: operador@example.org
                ativo: true
                pontos:
                - id: 3
                  nome: Ecoponto Exemplo
        '403':
          description: Selecione um ator de demonstração válido (X-Ator-Tipo e X-Ator-Id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: ACESSO_NEGADO
                mensagem: Selecione um ator de demonstração válido (X-Ator-Tipo e X-Ator-Id).
                errosCampos: []
        '200':
          description: Vínculo já existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorResponse'
              example:
                id: 3
                nome: Operador de Apoio
                email: operador@example.org
                ativo: true
                pontos:
                - id: 3
                  nome: Ecoponto Exemplo
    delete:
      tags:
      - Operadores
      summary: Remove o vínculo entre o operador e o ponto (administrador)
      operationId: desvincular
      parameters:
      - name: X-Ator-Tipo
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMINISTRADOR
          - MORADOR
          - OPERADOR
        description: Contexto fictício. Use o papel permitido pela operação.
        example: ADMINISTRADOR
      - name: X-Ator-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
        description: Obrigatório para MORADOR e OPERADOR. Consulte /api/v1/demo/atores.
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      - name: pontoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      responses:
        '204':
          description: Operação concluída, sem corpo de resposta.
        '403':
          description: Selecione um ator de demonstração válido (X-Ator-Tipo e X-Ator-Id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: ACESSO_NEGADO
                mensagem: Selecione um ator de demonstração válido (X-Ator-Tipo e X-Ator-Id).
                errosCampos: []
