spring.application.name=coleta-seletiva-api

# Conexão com o PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate confere se as tabelas correspondem às entidades
spring.jpa.hibernate.ddl-auto=validate

# Flyway executa as migrações do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Mensagens de validação sempre em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Nunca expor stack trace, mensagem interna ou detalhes de binding nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never